<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBF Editor Web</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="h-screen w-screen flex flex-col bg-gray-50 text-gray-800">

    <!-- ヘッダー（保存・閉じるボタンをここに配置） -->
    <header class="bg-blue-700 text-white px-6 py-3 shadow-md flex items-center z-10 shrink-0">
        <div class="mr-8">
            <h1 class="text-xl font-bold flex items-center">
                <img src="/favicon.jpg" alt="Logo" class="w-8 h-8 mr-3 rounded-lg shadow-sm" style="width: 32px; height: 32px; object-fit: cover;">
                DBF Editor <span class="text-xs font-normal ml-2 text-blue-200">v1.0.7</span>
            </h1>
        </div>
        <div id="actionButtons" class="flex space-x-3 items-center">
            <!-- 1. プルダウン -->
            <div class="bg-blue-800 rounded px-3 py-1 flex items-center text-sm shadow-inner">
                <span class="material-icons text-sm mr-1">language</span>
                <select id="encodingSelect" class="bg-transparent text-white outline-none font-bold cursor-pointer">
                    <option value="932" class="text-gray-900 bg-white">Shift-JIS (日本語)</option>
                    <option value="UTF8" class="text-gray-900 bg-white">UTF-8</option>
                </select>
            </div>
            
            <!-- 2. 保存 -->
            <button id="saveBtn" class="hidden px-4 py-2 bg-green-500 hover:bg-green-600 rounded-md shadow text-sm font-bold transition-colors flex items-center">
                <span class="material-icons text-sm mr-1">save</span>保存
            </button>

            <!-- 3. ファイルを開く -->
            <button id="headerOpenBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-md shadow text-sm font-bold transition-colors flex items-center border border-blue-500">
                <span class="material-icons text-sm mr-1">folder_open</span>ファイルを開く
            </button>

            <!-- 4. 閉じる -->
            <button id="closeBtn" class="hidden px-4 py-2 bg-gray-500 hover:bg-gray-600 rounded-md shadow text-sm font-bold transition-colors flex items-center">
                <span class="material-icons text-sm mr-1">close</span>閉じる
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 relative w-full h-full overflow-hidden">
        
        <!-- ファイルアップロード画面 -->
        <div id="uploadSection" class="absolute inset-0 flex flex-col items-center justify-center p-6 bg-gray-50 z-0">
            <div id="dropZone" class="w-full max-w-2xl p-12 border-4 border-dashed border-gray-300 rounded-2xl bg-white flex flex-col items-center justify-center text-center hover:border-blue-500 hover:bg-blue-50 transition-all cursor-pointer shadow-sm">
                <span class="material-icons text-6xl text-gray-400 mb-4">upload_file</span>
                <h2 class="text-2xl font-bold text-gray-700 mb-2">DBFファイルをドロップして開く</h2>
                <p class="text-gray-500 mb-6">または、ここをクリックしてファイルを選択してください</p>
                <div class="flex items-center space-x-2 text-sm text-gray-400 bg-gray-100 px-4 py-2 rounded-full">
                    <span class="material-icons text-sm">info</span>
                    <span>ファイルはブラウザ内で処理され、サーバーには送信されません</span>
                </div>
                <input type="file" id="fileInput" accept=".dbf" class="hidden">
            </div>
        </div>

        <!-- スプレッドシート画面 -->
        <div id="editorSection" class="hidden absolute inset-0 bg-white z-0 flex flex-col">
            
            <!-- 入力バー (Formula Bar) -->
            <div class="flex items-center bg-gray-50 border-b border-gray-300 px-3 py-1.5 shrink-0 shadow-sm z-10">
                <div class="flex items-center justify-center w-12 h-7 bg-white border border-gray-300 rounded mr-3 text-gray-600 font-bold font-mono text-sm shadow-inner" id="selectedCellLabel">
                    -
                </div>
                <div class="text-gray-400 mr-2 flex items-center" title="関数の挿入">
                    <span class="material-icons" style="font-size: 20px;">functions</span>
                </div>
                <input type="text" id="formulaBar" class="flex-1 bg-white border border-gray-300 rounded px-3 py-1 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-mono text-sm shadow-inner" placeholder="セルを選択してください" disabled>
            </div>

            <div id="spreadsheet" class="w-full flex-1"></div>
        </div>

    </main>

    <!-- ローディング画面 -->
    <div id="loading" class="hidden fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-blue-200 border-t-blue-600 mb-4"></div>
        <p class="text-lg font-bold text-gray-700">処理中...</p>
    </div>

    <!-- カスタムモーダル (alert, confirm, promptの代わり) -->
    <div id="customModal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center opacity-0 transition-opacity duration-200">
        <div id="modalContent" class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 transform scale-95 transition-transform duration-200">
            <h3 id="modalTitle" class="text-xl font-bold text-gray-800 mb-2">確認</h3>
            <p id="modalMessage" class="text-gray-600 mb-4 whitespace-pre-wrap"></p>
            
            <!-- Prompt用入力欄 -->
            <input type="text" id="modalInput" class="hidden w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 mb-6" autocomplete="off">
            
            <div class="flex justify-end space-x-3 mt-2">
                <button id="modalCancel" class="px-4 py-2 rounded-md font-medium text-gray-700 hover:bg-gray-100 transition-colors">キャンセル</button>
                <button id="modalConfirm" class="px-4 py-2 rounded-md font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-sm">OK</button>
            </div>
        </div>
    </div>

    <!-- エンコーディング選択モーダル -->
    <div id="encodingModal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center opacity-0 transition-opacity duration-200 bg-black/40 backdrop-blur-sm">
        <div id="encodingModalContent" class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200">
            <h3 class="text-xl font-bold text-gray-800 mb-2">文字コードの選択</h3>
            <p class="text-gray-600 mb-6 text-sm">開くファイルの文字コードを選択してください。</p>
            <div class="flex flex-col space-y-3">
                <button id="btnEncodingSjis" class="w-full px-4 py-3 rounded-md font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 transition-colors shadow-sm">Shift-JIS (日本語)</button>
                <button id="btnEncodingUtf8" class="w-full px-4 py-3 rounded-md font-bold text-gray-700 bg-gray-50 hover:bg-gray-100 border border-gray-200 transition-colors shadow-sm">UTF-8</button>
            </div>
            <div class="flex justify-end mt-4">
                <button id="encodingModalCancel" class="px-4 py-2 rounded-md font-medium text-gray-500 hover:bg-gray-100 transition-colors text-sm">キャンセル</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
