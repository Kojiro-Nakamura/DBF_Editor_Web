<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBF Editor Web</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="h-screen w-screen flex flex-col bg-gray-50 text-gray-800">

    <!-- ヘッダー（保存・閉じるボタンをここに配置） -->
    <header class="bg-blue-700 text-white px-6 py-3 shadow-md flex justify-between items-center z-10 shrink-0">
        <h1 class="text-xl font-bold flex items-center">
            <img src="/favicon.jpg" alt="Logo" class="w-8 h-8 mr-3 rounded shadow-sm border border-blue-500">
            DBF Editor
        </h1>
        <div id="actionButtons" class="hidden flex space-x-3 items-center">
            <div class="bg-blue-800 rounded px-3 py-1 flex items-center text-sm shadow-inner mr-2">
                <span class="material-icons text-sm mr-1">language</span>
                <select id="encodingSelect" class="bg-transparent text-white outline-none font-bold cursor-pointer">
                    <option value="932">Shift-JIS (日本語)</option>
                    <option value="UTF8">UTF-8</option>
                </select>
            </div>
            <button id="closeBtn" class="px-4 py-2 bg-gray-500 hover:bg-gray-600 rounded-md shadow text-sm font-bold transition-colors flex items-center">
                <span class="material-icons text-sm mr-1">close</span>閉じる
            </button>
            <button id="saveBtn" class="px-4 py-2 bg-green-500 hover:bg-green-600 rounded-md shadow text-sm font-bold transition-colors flex items-center">
                <span class="material-icons text-sm mr-1">save</span>保存
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 relative w-full h-full overflow-hidden">
        
        <!-- ファイルアップロード画面 -->
        <div id="uploadSection" class="absolute inset-0 flex flex-col items-center justify-center p-6 bg-gray-50 z-0">
            <div id="dropZone" class="w-full max-w-2xl p-12 border-4 border-dashed border-gray-300 rounded-2xl bg-white flex flex-col items-center justify-center text-center hover:border-blue-500 hover:bg-blue-50 transition-all cursor-pointer shadow-sm">
                <span class="material-icons text-6xl text-gray-400 mb-4">upload_file</span>
                <h2 class="text-2xl font-bold text-gray-700 mb-2">DBFファイルをドロップして開く</h2>
                <p class="text-gray-500 mb-6">または、ここをクリックしてファイルを選択してください</p>
                <div class="flex items-center space-x-2 text-sm text-gray-400 bg-gray-100 px-4 py-2 rounded-full">
                    <span class="material-icons text-sm">info</span>
                    <span>ファイルはブラウザ内で処理され、サーバーには送信されません</span>
                </div>
                <input type="file" id="fileInput" accept=".dbf" class="hidden">
            </div>
        </div>

        <!-- スプレッドシート画面 -->
        <div id="editorSection" class="hidden absolute inset-0 bg-white z-0 flex flex-col">
            <div id="spreadsheet" class="w-full flex-1"></div>
        </div>

    </main>

    <!-- ローディング画面 -->
    <div id="loading" class="hidden fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-blue-200 border-t-blue-600 mb-4"></div>
        <p class="text-lg font-bold text-gray-700">処理中...</p>
    </div>

    <!-- カスタムモーダル (alert, confirm, promptの代わり) -->
    <div id="customModal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center opacity-0 transition-opacity duration-200">
        <div id="modalContent" class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 transform scale-95 transition-transform duration-200">
            <h3 id="modalTitle" class="text-xl font-bold text-gray-800 mb-2">確認</h3>
            <p id="modalMessage" class="text-gray-600 mb-4 whitespace-pre-wrap"></p>
            
            <!-- Prompt用入力欄 -->
            <input type="text" id="modalInput" class="hidden w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 mb-6" autocomplete="off">
            
            <div class="flex justify-end space-x-3 mt-2">
                <button id="modalCancel" class="px-4 py-2 rounded-md font-medium text-gray-700 hover:bg-gray-100 transition-colors">キャンセル</button>
                <button id="modalConfirm" class="px-4 py-2 rounded-md font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-sm">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
